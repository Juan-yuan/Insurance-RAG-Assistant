# MySQL
[mysql]
host = localhost
user = root
password = 123456
database = subjects_kg

# Redis (Docker maps container 6379 -> host 8379)
[redis]
host = localhost
port = 8379
password = 1234
db = 02

# log
[logger]
log_file = logs/app.log

# Milvus
[milvus]
host = localhost
port = 19530
database_name = edurag
collection_name = edurag_final

# LLM
[llm]
model = gpt-5-mini
openai_api_key =
openai_base_url = https://api.openai.com/v1

# Retrieval
[retrieval]
parent_chunk_size = 1200
child_chunk_size = 300
chunk_overlap = 50
retrieval_k = 5
candidate_m = 2

# App
[app]
valid_sources = ["ai", "java", "test", "ops", "bigdata"]
customer_service_phone = 13112345678
