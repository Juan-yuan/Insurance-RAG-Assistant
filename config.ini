# MySQL Configuration
[mysql]
host = localhost
user = edu_rag
password = ${MYSQL_PASSWORD}
database = subjects_kg


# Redis Configuration
[redis]
host = localhost
port = 6379
password = ${REDIS_PASSWORD}
db = 0


# Milvus Configuration
[milvus]
host = localhost
port = 19530
database_name = edurag
collection_name = edurag_01


# Logging Configuration
[logger]
log_file = logs/app.log


# LLM Configuration
[llm]
model = gpt-5-mini
openai_api_key =
openai_base_url = https://api.openai.com/v1


# Retrieval Parameters Configuration
[retrieval]
parent_chunk_size = 1200
child_chunk_size = 300
chunk_overlap = 50
retrieval_k = 5
candidate_m = 2


# Application Configuration
[app]
valid_sources = ["ai", "java", "test", "ops", "bigdata"]
customer_service_phone = 10086